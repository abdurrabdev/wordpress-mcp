<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Xhunta WordPress MCP{% endblock %}</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7fb;color:#111827}
header{height:64px;background:#111827;color:white;display:flex;align-items:center;padding:0 28px;justify-content:space-between}
.brand{font-weight:800;letter-spacing:.2px}.layout{display:flex;min-height:calc(100vh - 64px)}
nav{width:230px;background:white;border-right:1px solid #e5e7eb;padding:20px 14px}nav a{display:block;padding:11px 13px;margin:3px 0;border-radius:8px;color:#374151;text-decoration:none}nav a:hover{background:#f3f4f6;color:#2563eb}
main{flex:1;padding:32px;max-width:1250px}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:22px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
h1{margin-top:0;font-size:28px}h2{font-size:19px;margin-top:0}.muted{color:#6b7280}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stat{padding:18px;border:1px solid #e5e7eb;border-radius:12px}.stat strong{display:block;font-size:22px;margin-top:5px}
label{display:block;font-weight:650;font-size:14px;margin:14px 0 7px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:8px;font:inherit;background:white}textarea{min-height:150px}
button,.button{display:inline-block;border:0;border-radius:8px;background:#2563eb;color:white;padding:10px 15px;font-weight:650;text-decoration:none;cursor:pointer}.secondary{background:#eef2ff;color:#1d4ed8}.danger{background:#dc2626}.success{color:#15803d}.error{color:#b91c1c}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e5e7eb;font-size:14px}th{color:#6b7280;font-weight:650}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#ecfdf5;color:#047857;font-size:12px;font-weight:700}.badge.off{background:#f3f4f6;color:#6b7280}
small{color:#6b7280}@media(max-width:800px){nav{width:180px}.grid{grid-template-columns:1fr}main{padding:18px}}
</style>
</head>
<body>
<header><div class="brand">Xhunta WordPress MCP</div><form method="post" action="/admin/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="secondary">Logout</button></form></header>
<div class="layout">
<nav>
<a href="/admin">Dashboard</a><a href="/admin/sites">WordPress Sites</a><a href="/admin/ai-connections">AI Connections</a><a href="/admin/settings">Server Settings</a><a href="/admin/logs">Activity Logs</a>
</nav>
<main>{% block content %}{% endblock %}</main>
</div>
</body></html>
