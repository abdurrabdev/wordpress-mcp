<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Xhunta MCP</title>
<style>body{margin:0;background:#f6f7fb;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.box{background:white;padding:30px;border:1px solid #e5e7eb;border-radius:14px;width:min(420px,92vw)}input{width:100%;padding:11px;margin:7px 0 14px;box-sizing:border-box;border:1px solid #d1d5db;border-radius:8px}button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:700;width:100%}.err{color:#b91c1c}</style></head>
